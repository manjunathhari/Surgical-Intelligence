[package]
name = "si-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Local command-line interface for Surgical Intelligence memory stores"

[[bin]]
name = "si"
path = "src/main.rs"

[dependencies]
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
si-core = { path = "../si-core" }
si-registry-adapter = { path = "../si-registry-adapter" }
uuid = { version = "1", features = ["v4"] }

si-publication-adapter = { path = "../si-publication-adapter" }
sha2 = "0.10"
hex = "0.4"

sha2 = "0.10"
hex = "0.4"
