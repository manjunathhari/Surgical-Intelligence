[package]
name = "si-registry-adapter"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Offline adapter for de-identified Surgical Registry exports"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
hmac = "0.12"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["serde", "v4", "v5"] }

si-core = { path = "../si-core" }
